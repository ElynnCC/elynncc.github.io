<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8984"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e34948"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="430" fill="#ffffff" rx="10"/>
  <style>
    .box{fill:#f4f3ef;stroke:#8a8984;stroke-width:1.4;rx:8}
    .boxhot{fill:#fde8e7;stroke:#e34948;stroke-width:2;rx:8}
    .lbl{fill:#0b0b0b;text-anchor:middle;font-weight:600}
    .sub{fill:#52514e;text-anchor:middle;font-size:11}
    .h{fill:#0b0b0b;font-size:15;font-weight:700}
    .note{fill:#52514e;font-size:12}
    .edge{stroke:#8a8984;stroke-width:1.6;fill:none;marker-end:url(#arr)}
    .hot{stroke:#e34948;stroke-width:2.6;fill:none;marker-end:url(#arrRed)}
    .gantt{rx:3}
  </style>

  <!-- BEFORE -->
  <text x="20" y="28" class="h">Before: a chain. Every specialist waits for the one before it.</text>
  <g transform="translate(20,45)">
    <rect x="0" y="20" width="110" height="46" class="boxhot"/><text x="55" y="40" class="lbl">Planner</text><text x="55" y="56" class="sub">4 s</text>
    <rect x="160" y="20" width="110" height="46" class="boxhot"/><text x="215" y="40" class="lbl">Coder</text><text x="215" y="56" class="sub">6 s</text>
    <rect x="320" y="20" width="110" height="46" class="boxhot"/><text x="375" y="40" class="lbl">Style check</text><text x="375" y="56" class="sub">3 s</text>
    <rect x="480" y="20" width="110" height="46" class="boxhot"/><text x="535" y="40" class="lbl">Logic check</text><text x="535" y="56" class="sub">5 s</text>
    <rect x="640" y="20" width="110" height="46" class="boxhot"/><text x="695" y="40" class="lbl">Style check</text><text x="695" y="56" class="sub">3 s (again)</text>
    <line x1="110" y1="43" x2="158" y2="43" class="hot"/>
    <line x1="270" y1="43" x2="318" y2="43" class="hot"/>
    <line x1="430" y1="43" x2="478" y2="43" class="hot"/>
    <line x1="590" y1="43" x2="638" y2="43" class="hot"/>
    <text x="780" y="47" class="note">= 21 s wait</text>
    <!-- gantt -->
    <g transform="translate(0,95)">
      <rect x="0" y="0" width="80" height="12" fill="#e34948" class="gantt"/>
      <rect x="82" y="14" width="120" height="12" fill="#e34948" class="gantt"/>
      <rect x="204" y="28" width="60" height="12" fill="#e34948" class="gantt"/>
      <rect x="266" y="42" width="100" height="12" fill="#e34948" class="gantt"/>
      <rect x="368" y="56" width="60" height="12" fill="#e34948" class="gantt"/>
      <line x1="0" y1="74" x2="430" y2="74" stroke="#cfcecb"/>
      <text x="0" y="90" class="note">0 s</text><text x="430" y="90" class="note" text-anchor="end">21 s</text>
      <text x="450" y="40" class="note">Timeline of who is working when.</text>
      <text x="450" y="58" class="note">Red = on the critical path, the chain that sets the total wait.</text>
    </g>
  </g>

  <!-- AFTER -->
  <text x="20" y="262" class="h">After: two edits. Independent checks run side by side; the repeat is dropped.</text>
  <g transform="translate(20,280)">
    <rect x="0" y="40" width="110" height="46" class="boxhot"/><text x="55" y="60" class="lbl">Planner</text><text x="55" y="76" class="sub">4 s</text>
    <rect x="160" y="40" width="110" height="46" class="boxhot"/><text x="215" y="60" class="lbl">Coder</text><text x="215" y="76" class="sub">6 s</text>
    <rect x="320" y="0" width="110" height="46" class="box"/><text x="375" y="20" class="lbl">Style check</text><text x="375" y="36" class="sub">3 s</text>
    <rect x="320" y="80" width="110" height="46" class="boxhot"/><text x="375" y="100" class="lbl">Logic check</text><text x="375" y="116" class="sub">5 s</text>
    <line x1="110" y1="63" x2="158" y2="63" class="hot"/>
    <path d="M270,63 C300,63 290,23 318,23" class="edge"/>
    <path d="M270,63 C300,63 290,103 318,103" class="hot"/>
    <text x="450" y="58" class="note">= 15 s wait,</text>
    <text x="450" y="76" class="note">same answer</text>
    <text x="450" y="94" class="note">quality</text>
    <!-- gantt -->
    <g transform="translate(560,0)">
      <rect x="0" y="0" width="80" height="12" fill="#e34948" class="gantt"/>
      <rect x="82" y="14" width="120" height="12" fill="#e34948" class="gantt"/>
      <rect x="204" y="28" width="60" height="12" fill="#b8b7b2" class="gantt"/>
      <rect x="204" y="42" width="100" height="12" fill="#e34948" class="gantt"/>
      <line x1="0" y1="62" x2="304" y2="62" stroke="#cfcecb"/>
      <text x="0" y="78" class="note">0 s</text><text x="304" y="78" class="note" text-anchor="end">15 s</text>
      <text x="0" y="104" class="note">Six seconds shorter, three fewer</text>
      <text x="0" y="120" class="note">model calls to pay for.</text>
    </g>
  </g>
</svg>
